name: SEO & Accessibility Audit

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-accessibility-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  HUGO_VERSION: "0.157.0"
  GO_VERSION: "1.26.0"

  LIVE_URL: "https://4rm0byte.netlify.app"
  LOCAL_URL: "http://127.0.0.1:4173"

  REPORT_DIR: ".github/seo-reports"

jobs:
  audit:
    name: Build & Audit Website
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7

      # ============================================================
      # NODE 24
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ============================================================
      # GO
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ============================================================
      # HUGO
      # ============================================================

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # ============================================================
      # INSTALL WEBSITE DEPENDENCIES
      # ============================================================

      - name: Install website dependencies
        run: npm install

      # ============================================================
      # HUGO MODULES
      # ============================================================

      - name: Prepare Hugo modules
        run: |
          hugo mod tidy
          hugo mod get

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build production website
        run: npm run build

      # ============================================================
      # VERIFY BUILD
      # ============================================================

      - name: Verify production build
        run: |
          set -euo pipefail

          echo "Checking Hugo production build..."

          test -d public
          test -f public/index.html

          echo ""
          echo "Build size:"
          du -sh public

          echo ""
          echo "Generated files:"
          find public -type f | wc -l

      # ============================================================
      # PREPARE REPORTS
      # ============================================================

      - name: Prepare audit directories
        run: |
          rm -rf "${REPORT_DIR}"

          mkdir -p "${REPORT_DIR}"
          mkdir -p ".github/audit"

      # ============================================================
      # INSTALL AUDIT TOOLS
      # ============================================================

      - name: Install audit tooling
        working-directory: .github/audit
        run: |
          set -euo pipefail

          npm init -y

          npm install \
            lighthouse@13.4.1 \
            pa11y@9.1.1 \
            axe-core@4.13.0 \
            playwright@1.55.0

          npx playwright install --with-deps chromium

      # ============================================================
      # START LOCAL SERVER
      # ============================================================

      - name: Start local production server
        run: |
          set -euo pipefail

          echo "Starting HTTP server..."

          nohup python3 -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory public \
            > .github/local-server.log 2>&1 &

          SERVER_PID=$!

          echo "${SERVER_PID}" > .github/local-server.pid

          sleep 1

          if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
            echo "Local server died immediately."

            cat .github/local-server.log

            exit 1
          fi

          echo "Local server started with PID ${SERVER_PID}."

      # ============================================================
      # LOCAL SERVER HEALTH CHECK
      # ============================================================

      - name: Verify local production server
        run: |
          set -euo pipefail

          echo "Waiting for ${LOCAL_URL}..."

          for attempt in {1..30}; do

            if curl \
              --silent \
              --show-error \
              --fail \
              --max-time 5 \
              "${LOCAL_URL}" \
              > /dev/null; then

              echo ""
              echo "Local production site is READY."
              echo "URL: ${LOCAL_URL}"

              exit 0
            fi

            if [ -f .github/local-server.pid ]; then

              SERVER_PID="$(cat .github/local-server.pid)"

              if ! kill -0 "${SERVER_PID}" 2>/dev/null; then

                echo ""
                echo "Local server stopped unexpectedly."
                echo ""
                echo "Server log:"
                cat .github/local-server.log

                exit 1
              fi

            fi

            echo "Attempt ${attempt}/30: site not ready yet."

            sleep 2

          done

          echo ""
          echo "Local production site never became available."
          echo ""
          echo "Server log:"
          cat .github/local-server.log

          exit 1

      # ============================================================
      # LIGHTHOUSE OFFLINE
      # ============================================================

      - name: Lighthouse - Offline
        id: lighthouse_offline
        if: always()
        continue-on-error: true
        run: |
          .github/audit/node_modules/.bin/lighthouse \
            "${LOCAL_URL}" \
            --output=json \
            --output-path="${REPORT_DIR}/lighthouse-offline.json" \
            --only-categories=seo,accessibility \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      # ============================================================
      # LIGHTHOUSE LIVE
      # ============================================================

      - name: Lighthouse - Live
        id: lighthouse_live
        if: always()
        continue-on-error: true
        run: |
          .github/audit/node_modules/.bin/lighthouse \
            "${LIVE_URL}" \
            --output=json \
            --output-path="${REPORT_DIR}/lighthouse-live.json" \
            --only-categories=seo,accessibility \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      # ============================================================
      # PA11Y OFFLINE
      # ============================================================

      - name: Pa11y - Offline
        id: pa11y_offline
        if: always()
        continue-on-error: true
        run: |
          .github/audit/node_modules/.bin/pa11y \
            "${LOCAL_URL}" \
            --reporter json \
            > "${REPORT_DIR}/pa11y-offline.json"

      # ============================================================
      # PA11Y LIVE
      # ============================================================

      - name: Pa11y - Live
        id: pa11y_live
        if: always()
        continue-on-error: true
        run: |
          .github/audit/node_modules/.bin/pa11y \
            "${LIVE_URL}" \
            --reporter json \
            > "${REPORT_DIR}/pa11y-live.json"

      # ============================================================
      # AXE OFFLINE
      # ============================================================

      - name: axe-core - Offline
        id: axe_offline
        if: always()
        continue-on-error: true
        run: |
          node .github/scripts/run-axe.mjs \
            "${LOCAL_URL}" \
            "${REPORT_DIR}/axe-offline.json"

      # ============================================================
      # AXE LIVE
      # ============================================================

      - name: axe-core - Live
        id: axe_live
        if: always()
        continue-on-error: true
        run: |
          node .github/scripts/run-axe.mjs \
            "${LIVE_URL}" \
            "${REPORT_DIR}/axe-live.json"

      # ============================================================
      # GENERATE SUMMARY
      # ============================================================

      - name: Generate audit summary
        if: always()
        env:
          LIVE_URL: ${{ env.LIVE_URL }}
          LOCAL_URL: ${{ env.LOCAL_URL }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/create-audit-summary.mjs

      # ============================================================
      # UPLOAD REPORTS
      # ============================================================

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-accessibility-audit-${{ github.run_number }}
          path: |
            .github/seo-reports/
            .github/local-server.log
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # DISCORD
      # ============================================================

      - name: Send audit results to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SEO_ACCESSIBILITY_WEBHOOK }}
          LIVE_URL: ${{ env.LIVE_URL }}
          LOCAL_URL: ${{ env.LOCAL_URL }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/send-audit-discord.mjs

      # ============================================================
      # STOP LOCAL SERVER
      # ============================================================

      - name: Stop local production server
        if: always()
        run: |
          if [ -f .github/local-server.pid ]; then

            SERVER_PID="$(cat .github/local-server.pid)"

            kill "${SERVER_PID}" 2>/dev/null || true

          fi

      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: Evaluate audit execution
        if: always()
        run: |
          echo "========================================"
          echo "Audit Execution Results"
          echo "========================================"

          echo ""
          echo "Lighthouse Offline : ${{ steps.lighthouse_offline.outcome }}"
          echo "Lighthouse Live    : ${{ steps.lighthouse_live.outcome }}"
          echo "Pa11y Offline      : ${{ steps.pa11y_offline.outcome }}"
          echo "Pa11y Live         : ${{ steps.pa11y_live.outcome }}"
          echo "axe Offline        : ${{ steps.axe_offline.outcome }}"
          echo "axe Live           : ${{ steps.axe_live.outcome }}"

          echo ""
          echo "Reports have been generated and sent to Discord."
