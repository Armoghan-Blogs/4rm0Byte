name: SEO & Accessibility Audit

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-accessibility-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "21.7.3"
  HUGO_VERSION: "0.157.0"
  GO_VERSION: "1.26.0"

  LIVE_URL: "https://4rm0byte.netlify.app"
  LOCAL_URL: "http://127.0.0.1:4173"

  REPORT_DIR: ".github/seo-reports"

jobs:
  audit:
    name: Build & Audit Website
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ============================================================
      # GO
      # ============================================================

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ============================================================
      # HUGO
      # ============================================================

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Hugo modules
        run: |
          hugo mod tidy
          hugo mod get

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build production website
        run: npm run build

      - name: Verify production build
        run: |
          echo "========================================"
          echo "Production Build Verification"
          echo "========================================"

          test -d public
          test -f public/index.html

          echo ""
          echo "Build size:"
          du -sh public

          echo ""
          echo "Generated files:"
          find public -type f | wc -l

          echo ""
          echo "Build directory:"
          find public -maxdepth 2 -type f | head -50

      # ============================================================
      # REPORT DIRECTORY
      # ============================================================

      - name: Prepare audit report directory
        run: |
          rm -rf "${REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"

      # ============================================================
      # SERVE EXACT BUILD ON GITHUB ACTIONS VM
      # ============================================================

      - name: Start local production server
        run: |
          echo "Starting temporary server for the exact production build..."

          nohup python3 -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory public \
            > .github/local-server.log 2>&1 &

          echo $! > .github/local-server.pid

      - name: Wait for local production site
        run: |
          echo "Waiting for local production site..."

          for i in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              "${LOCAL_URL}" \
              > /dev/null; then

              echo "Local production site is ready."
              exit 0
            fi

            sleep 2
          done

          echo "Local production site failed to start."
          echo ""
          echo "Server log:"
          cat .github/local-server.log

          exit 1

      # ============================================================
      # INSTALL AUDIT TOOLS
      # ============================================================

      - name: Install audit tools
        run: |
          npm install --global \
            lighthouse \
            pa11y \
            @axe-core/cli

      # ============================================================
      # LIGHTHOUSE - OFFLINE
      # ============================================================

      - name: Lighthouse - Offline build
        id: lighthouse-offline
        continue-on-error: true
        run: |
          lighthouse "${LOCAL_URL}" \
            --output=json \
            --output-path="${REPORT_DIR}/lighthouse-offline.json" \
            --only-categories=seo,accessibility \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      # ============================================================
      # LIGHTHOUSE - LIVE
      # ============================================================

      - name: Lighthouse - Live Netlify
        id: lighthouse-live
        continue-on-error: true
        run: |
          lighthouse "${LIVE_URL}" \
            --output=json \
            --output-path="${REPORT_DIR}/lighthouse-live.json" \
            --only-categories=seo,accessibility \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"

      # ============================================================
      # PA11Y - OFFLINE
      # ============================================================

      - name: Pa11y - Offline build
        id: pa11y-offline
        continue-on-error: true
        run: |
          pa11y "${LOCAL_URL}" \
            --reporter json \
            > "${REPORT_DIR}/pa11y-offline.json"

      # ============================================================
      # PA11Y - LIVE
      # ============================================================

      - name: Pa11y - Live Netlify
        id: pa11y-live
        continue-on-error: true
        run: |
          pa11y "${LIVE_URL}" \
            --reporter json \
            > "${REPORT_DIR}/pa11y-live.json"

      # ============================================================
      # AXE - OFFLINE
      # ============================================================

      - name: axe-core - Offline build
        id: axe-offline
        continue-on-error: true
        run: |
          axe "${LOCAL_URL}" \
            --save "${REPORT_DIR}/axe-offline.json"

      # ============================================================
      # AXE - LIVE
      # ============================================================

      - name: axe-core - Live Netlify
        id: axe-live
        continue-on-error: true
        run: |
          axe "${LIVE_URL}" \
            --save "${REPORT_DIR}/axe-live.json"

      # ============================================================
      # GENERATE SUMMARY
      # ============================================================

      - name: Generate audit summary
        if: always()
        env:
          LIVE_URL: ${{ env.LIVE_URL }}
          LOCAL_URL: ${{ env.LOCAL_URL }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/create-audit-summary.mjs

      # ============================================================
      # UPLOAD REPORTS
      # ============================================================

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-accessibility-audit-${{ github.run_number }}
          path: |
            .github/seo-reports/
            .github/local-server.log
          retention-days: 30
          if-no-files-found: warn

      # ============================================================
      # DISCORD
      # ============================================================

      - name: Send audit results to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SEO_ACCESSIBILITY_WEBHOOK }}
          LIVE_URL: ${{ env.LIVE_URL }}
          LOCAL_URL: ${{ env.LOCAL_URL }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/send-audit-discord.mjs

      # ============================================================
      # STOP SERVER
      # ============================================================

      - name: Stop local production server
        if: always()
        run: |
          if [ -f .github/local-server.pid ]; then
            kill "$(cat .github/local-server.pid)" 2>/dev/null || true
          fi

      # ============================================================
      # FAIL WORKFLOW IF AUDIT TOOL ITSELF FAILED
      # ============================================================

      - name: Evaluate audit execution
        if: always()
        run: |
          echo "Audit execution status:"
          echo ""
          echo "Lighthouse Offline: ${{ steps.lighthouse-offline.outcome }}"
          echo "Lighthouse Live:    ${{ steps.lighthouse-live.outcome }}"
          echo "Pa11y Offline:      ${{ steps.pa11y-offline.outcome }}"
          echo "Pa11y Live:         ${{ steps.pa11y-live.outcome }}"
          echo "axe Offline:        ${{ steps.axe-offline.outcome }}"
          echo "axe Live:           ${{ steps.axe-live.outcome }}"

          if [ \
            "${{ steps.lighthouse-offline.outcome }}" = "failure" ] || \
            [ "${{ steps.lighthouse-live.outcome }}" = "failure" ] || \
            [ "${{ steps.pa11y-offline.outcome }}" = "failure" ] || \
            [ "${{ steps.pa11y-live.outcome }}" = "failure" ] || \
            [ "${{ steps.axe-offline.outcome }}" = "failure" ] || \
            [ "${{ steps.axe-live.outcome }}" = "failure" ]; then

            echo ""
            echo "One or more audit tools failed to execute."
            exit 1
          fi
