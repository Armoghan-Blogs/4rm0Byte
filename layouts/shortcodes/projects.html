<style>
.project-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
  gap:1.75rem;
  margin:2rem 0;
}

.project-card{
  position:relative;
  isolation:isolate;
  border-radius:1.1rem;
  overflow:hidden;
  background:rgb(var(--color-neutral-50));
  border:1px solid rgb(var(--color-neutral-200));
  box-shadow:0 1px 3px rgb(var(--color-neutral-900) / .06);
  transition:transform .35s ease,box-shadow .35s ease,border-color .35s ease;
  display:flex;flex-direction:column;
}
html.dark .project-card{background:rgb(var(--color-neutral-800));border-color:rgb(var(--color-neutral-700));}

.project-card::before{
  content:"";
  position:absolute;
  top:-45%;left:-15%;
  width:65%;height:65%;
  background:radial-gradient(circle,rgb(var(--color-primary-500) / .35),transparent 70%);
  filter:blur(35px);
  opacity:0;
  transition:opacity .45s ease;
  z-index:0;
  pointer-events:none;
}
.project-card:hover::before{opacity:1;}
.project-card > *{position:relative;z-index:1;}

.project-card:hover{
  transform:translateY(-5px);
  box-shadow:0 22px 40px -14px rgb(var(--color-primary-500) / .3);
  border-color:rgb(var(--color-primary-400));
}
html.dark .project-card:hover{border-color:rgb(var(--color-primary-600));}

.project-card-featured{
  border-color:rgb(var(--color-primary-400));
  box-shadow:0 0 0 1px rgb(var(--color-primary-400) / .4),0 8px 20px -8px rgb(var(--color-primary-500) / .3);
}

.project-card-top{
  height:5px;
  background:linear-gradient(90deg,rgb(var(--color-primary-400)),rgb(var(--color-primary-600)));
}

.project-cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:rgb(var(--color-neutral-900));}
.project-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;}
.project-card:hover .project-cover img{transform:scale(1.06);}
.project-cover::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgb(var(--color-neutral-900) / .5) 100%);
}

.project-card-header{
  display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.6rem;
  padding:1.35rem 1.5rem 0;
}

.project-title-row{display:flex;align-items:center;gap:.6rem;min-width:0;}

.project-icon{
  flex-shrink:0;width:2.1rem;height:2.1rem;border-radius:9999px;
  display:flex;align-items:center;justify-content:center;
  background:rgb(var(--color-primary-500) / .12);
  color:rgb(var(--color-primary-600));
}
html.dark .project-icon{background:rgb(var(--color-primary-400) / .15);color:rgb(var(--color-primary-300));}
.project-icon svg{width:1.05rem;height:1.05rem;}

.project-title{font-size:1.15rem;font-weight:700;margin:0;color:rgb(var(--color-neutral-900));line-height:1.3;}
html.dark .project-title{color:rgb(var(--color-neutral-100));}

.project-meta{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem;flex-shrink:0;}

.project-period{
  font-size:.68rem;font-weight:600;letter-spacing:.03em;white-space:nowrap;
  padding:.22rem .6rem;border-radius:9999px;
  background:rgb(var(--color-primary-500) / .12);color:rgb(var(--color-primary-600));
}
html.dark .project-period{background:rgb(var(--color-primary-400) / .15);color:rgb(var(--color-primary-300));}

.project-status{
  display:inline-flex;align-items:center;gap:.35rem;
  font-size:.68rem;font-weight:600;white-space:nowrap;
  padding:.22rem .6rem;border-radius:9999px;
  background:rgb(var(--color-neutral-200));color:rgb(var(--color-neutral-600));
}
html.dark .project-status{background:rgb(var(--color-neutral-700));color:rgb(var(--color-neutral-300));}
.project-status::before{
  content:"";width:.4rem;height:.4rem;border-radius:9999px;
  background:rgb(var(--color-primary-500));
}

.project-tags{display:flex;flex-wrap:wrap;gap:.4rem;padding:.9rem 1.5rem 0;}
.project-tag{
  font-size:.7rem;font-weight:600;font-family:var(--font-mono,monospace);
  padding:.2rem .55rem;border-radius:.4rem;
  background:rgb(var(--color-neutral-200) / .7);color:rgb(var(--color-neutral-600));
}
html.dark .project-tag{background:rgb(var(--color-neutral-700) / .7);color:rgb(var(--color-neutral-300));}

.project-body{
  padding:1rem 1.5rem 0;
  font-size:.9rem;line-height:1.65;
  color:rgb(var(--color-neutral-600));
  flex:1;
}
html.dark .project-body{color:rgb(var(--color-neutral-400));}
.project-body p{margin:0 0 .85rem;}

.project-footer{
  display:flex;flex-wrap:wrap;align-items:stretch;gap:.75rem;
  padding:.5rem 1.5rem 1.5rem;
}
.project-footer > *{flex:1 1 220px;min-width:0;}
</style>

<div class="project-grid">
{{ .Inner }}
</div>
